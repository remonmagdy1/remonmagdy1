<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient1)" filter="url(#shadow)"/>
  
  <!-- Inner Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#gradient2)" opacity="0.9"/>
  
  <!-- Ring Light Icon -->
  <g transform="translate(256,256)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.8"/>
    
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.6"/>
    
    <!-- Center Light -->
    <circle cx="0" cy="0" r="40" fill="#ffffff" opacity="0.9"/>
    
    <!-- Light Rays -->
    <g stroke="#ffffff" stroke-width="4" opacity="0.7">
      <line x1="0" y1="-140" x2="0" y2="-160" />
      <line x1="99" y1="-99" x2="113" y2="-113" />
      <line x1="140" y1="0" x2="160" y2="0" />
      <line x1="99" y1="99" x2="113" y2="113" />
      <line x1="0" y1="140" x2="0" y2="160" />
      <line x1="-99" y1="99" x2="-113" y2="113" />
      <line x1="-140" y1="0" x2="-160" y2="0" />
      <line x1="-99" y1="-99" x2="-113" y2="-113" />
    </g>
    
    <!-- POS Elements -->
    <g transform="translate(0,20)">
      <!-- Screen -->
      <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#ffffff" opacity="0.8"/>
      <rect x="-25" y="-10" width="50" height="20" rx="2" fill="#4f46e5"/>
      
      <!-- Keyboard -->
      <rect x="-35" y="20" width="70" height="25" rx="3" fill="#ffffff" opacity="0.7"/>
      <rect x="-30" y="25" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      <rect x="-15" y="25" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      <rect x="0" y="25" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      <rect x="15" y="25" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      
      <rect x="-30" y="35" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      <rect x="-15" y="35" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      <rect x="0" y="35" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
      <rect x="15" y="35" width="10" height="6" rx="1" fill="#4f46e5" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Arabic Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#ffffff">
    رينج لايت
  </text>
  
  <!-- English Text -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial" font-size="18" fill="#ffffff" opacity="0.8">
    Ring Light POS
  </text>
</svg>
