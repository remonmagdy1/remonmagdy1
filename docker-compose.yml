# رينج لايت - Docker Compose
# Ring Light POS - Docker Compose Configuration

version: '3.8'

services:
  # التطبيق الرئيسي
  ringlight-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ringlight-pos
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - APP_NAME=ringlight-pos
    volumes:
      # ربط مجلد البيانات للاحتفاظ بها
      - ringlight-data:/app/data
      - ringlight-backups:/app/backups
      - ringlight-logs:/app/logs
    networks:
      - ringlight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ringlight.rule=Host(`ringlight.local`)"
      - "traefik.http.services.ringlight.loadbalancer.server.port=8080"

  # خادم ويب للملفات الثابتة (اختياري)
  ringlight-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy
    container_name: ringlight-web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ringlight-network
    depends_on:
      - ringlight-app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ringlight-web.rule=Host(`web.ringlight.local`)"

  # قاعدة بيانات (اختيارية للمشاريع المتقدمة)
  ringlight-db:
    image: postgres:15-alpine
    container_name: ringlight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ringlight_pos
      POSTGRES_USER: ringlight
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ringlight123}
    volumes:
      - ringlight-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ringlight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringlight -d ringlight_pos"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - database

  # Redis للتخزين المؤقت (اختياري)
  ringlight-redis:
    image: redis:7-alpine
    container_name: ringlight-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ringlight123}
    volumes:
      - ringlight-redis-data:/data
    networks:
      - ringlight-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - cache

  # مراقب النظام (اختياري)
  ringlight-monitor:
    image: prom/prometheus:latest
    container_name: ringlight-monitor
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ringlight-prometheus-data:/prometheus
    networks:
      - ringlight-network
    profiles:
      - monitoring

  # لوحة مراقبة (اختياري)
  ringlight-grafana:
    image: grafana/grafana:latest
    container_name: ringlight-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - ringlight-grafana-data:/var/lib/grafana
    networks:
      - ringlight-network
    depends_on:
      - ringlight-monitor
    profiles:
      - monitoring

# الشبكات
networks:
  ringlight-network:
    driver: bridge
    name: ringlight-network

# وحدات التخزين
volumes:
  ringlight-data:
    name: ringlight-data
    driver: local
  ringlight-backups:
    name: ringlight-backups
    driver: local
  ringlight-logs:
    name: ringlight-logs
    driver: local
  ringlight-db-data:
    name: ringlight-db-data
    driver: local
  ringlight-redis-data:
    name: ringlight-redis-data
    driver: local
  ringlight-prometheus-data:
    name: ringlight-prometheus-data
    driver: local
  ringlight-grafana-data:
    name: ringlight-grafana-data
    driver: local
