<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رينج لايت - نظام إدارة نقاط البيع العربي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Meta tags for PWA -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="رينج لايت">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="msapplication-config" content="browserconfig.xml">

    <!-- Icons for different platforms -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
    <link rel="mask-icon" href="assets/icons/safari-pinned-tab.svg" color="#4f46e5">
</head>
<body class="theme-blue">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-cash-register"></i>
                    <h1>رينج لايت</h1>
                    <p>نظام إدارة نقاط البيع العربي</p>
                </div>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
                <div class="login-info">
                    <p>كلمة المرور الافتراضية: ١٢٣</p>
                </div>
            </form>
            <div class="login-footer">
                <p>&copy; ٢٠٢٤ رينج لايت - جميع الحقوق محفوظة</p>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp" class="main-app hidden">
        <!-- شريط التنقل العلوي -->
        <header class="top-navbar">
            <div class="navbar-brand">
                <i class="fas fa-cash-register"></i>
                <span>رينج لايت</span>
            </div>
            <div class="navbar-center">
                <div class="search-box">
                    <input type="text" id="globalSearch" placeholder="البحث السريع...">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle" title="تغيير الثيم">
                    <i class="fas fa-palette"></i>
                </button>
                <button class="btn-icon" id="notificationsBtn" title="الإشعارات">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">٣</span>
                </button>
                <div class="user-menu">
                    <button class="btn-icon" id="userMenuBtn">
                        <i class="fas fa-user"></i>
                    </button>
                    <div class="dropdown-menu" id="userDropdown">
                        <a href="#" onclick="showSettings()">
                            <i class="fas fa-cog"></i>
                            الإعدادات
                        </a>
                        <a href="#" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            تسجيل الخروج
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- الشريط الجانبي -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active">
                        <a href="#" onclick="showPage('dashboard')" class="nav-link">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>لوحة المعلومات</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('sales')" class="nav-link">
                            <i class="fas fa-shopping-cart"></i>
                            <span>المبيعات</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('products')" class="nav-link">
                            <i class="fas fa-box"></i>
                            <span>المنتجات</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('customers')" class="nav-link">
                            <i class="fas fa-users"></i>
                            <span>العملاء</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('suppliers')" class="nav-link">
                            <i class="fas fa-truck"></i>
                            <span>الموردين</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('purchases')" class="nav-link">
                            <i class="fas fa-shopping-bag"></i>
                            <span>المشتريات</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('debts')" class="nav-link">
                            <i class="fas fa-money-bill-wave"></i>
                            <span>الديون والمدفوعات</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('reports')" class="nav-link">
                            <i class="fas fa-chart-bar"></i>
                            <span>التقارير</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" onclick="showPage('settings')" class="nav-link">
                            <i class="fas fa-cog"></i>
                            <span>الإعدادات</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <div id="pageContent">
                <!-- سيتم تحميل محتوى الصفحات هنا -->
            </div>
        </main>
    </div>

    <!-- النوافذ المنبثقة -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle">عنوان النافذة</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- محتوى النافذة المنبثقة -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- أزرار النافذة المنبثقة -->
            </div>
        </div>
    </div>

    <!-- الإشعارات -->
    <div id="notifications" class="notifications-container"></div>

    <!-- تحميل ملفات JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/products.js"></script>
    <script src="js/sales.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/suppliers.js"></script>
    <script src="js/purchases.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
